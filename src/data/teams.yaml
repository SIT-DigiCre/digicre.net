- id: pg
  name: PG班
  about:
    content: |
      PG班では、プログラミングによる創作をしています。

      ゲーム開発やアプリ開発の他にもWeb開発やマイコン、Raspberry Piなどを用いた開発や機械学習といった様々な分野があります。
  activity:
    content: |
      各々でなんでもアリなおもちゃを開発する「PGおもちゃ企画」、イラスト班やDTM班と協力してゲーム開発を行う「ゲームジャム企画」や「ゲーム制作企画」などがあります。

      他にもデジクリを支える「デジコア」や「Bolide」などのシステム開発もしています。
    works:
      - title: ゲーム制作企画
        image: /assets/images/works_pg_1.webp
        href: null
      - title: PGおもちゃ企画
        image: /assets/images/works_pg_2.webp
        href: null
  learn_more:
    - title: プログラミング未経験でも参加できますか？
      content: |
        はい、参加可能です！

        ゲーム開発で使用する「Unity」や「C#」、ウェブ制作などで使用する「HTML」や「JavaScript」は初心者講座で教えてもらえます！

        また、プログラミング歴の長い先輩もたくさん在籍しているため、わからないところがあればいつでも聞けます！　実際に制作してみて理解できるようになる部分もあるので、興味があれば是非参加してみてください！
    - title: 主に使われているプログラミング言語は何ですか？
      content: |
        JavaScript、TypeScript、Go、C#などを使っています。
    - title: 主に使用されているツールを教えてください！
      content: |
        「VSCode」というテキストエディターや「Unity」というゲームエンジンが使われています。

- id: 2dcg
  name: イラスト班
  about:
    content: |
      イラスト班では、主にパソコンやタブレットなどを使ったデジタルイラストの制作をしています。

      様々なキャラクターを描いたイラストの制作の他にも技術向上を目的とした模写などをしています。
  activity:
    content: |
      テーマに合わせたイラストをみんなで書いて合同誌にする「デジクリイラスト合同誌企画」やみんなで模写をする「模写会企画」などがあります。
    works:
      - title: 模写会企画
        image: /assets/images/works_2dcg_1.webp
        href: null
      - title: 合同誌企画
        image: /assets/images/works_2dcg_2.webp
        href: null
  learn_more:
    - title: お絵かき初心者です。デジクリのイラスト班で活動することに興味があります。イラストに関連した講座などは開催されていますか？
      content: |
        これまでのデジクリでは、イラストに関連した初心者向け講座が多数開催されてきました。

        例えば、After Effects講座やアニメーション講座、Live2D講座などがあり、制作に必要なソフトウェアの基本的な操作を学ぶことができます。
    - title: 合作に興味があります。デジクリのイラスト班では、複数人で一つの作品を制作するような活動は行っていますか？
      content: |
        はい、行っています。

        例えば、イラストを寄稿し合って一つの冊子を制作する「合同誌企画」や、ブラウザ上でリアルタイムに絵を描きながら交流できる「お絵描きチャット企画」、一つのテーマをもとにイラストから映像や音楽を発想し、MVを制作する「MV企画」などがあります。
    - title: デジクリでは、外部団体からイラスト制作の依頼を受けることはありますか？
      content: |
        はい、頻度は多くありませんが、外部団体からのご依頼をお受けすることがあります。

        例えば2025年度には、アカペラサークル「NewTone」様より、舞台背景イラストの制作を有償でご依頼いただいた実績があります。
    - title: 昔からアナログでイラストを描いてきていて、デジタルで描くのに挑戦してみたいです！　イラスト班の人たちはどんな機材を使っていますか？
      content: |
        部員の多くは液タブかiPadを使ってます！　じっくり描きたい人は液タブ、どこでも描きたい人はiPadを使っている印象です。デジクリの部室には誰でも使えるペンタブがあるので、お試ししてから決めるのもアリです！
    - title: 部員が描いたイラストをいっぱい見たいんですけど、作品を発表する機会ってどのくらいありますか？
      content: |
        作品を発表する機会は常にあります！　デジクリdiscordサーバーにある「イラスト置き場」チャンネルでは、ほぼ毎日部員の誰かがイラストを投稿しています。また、部内で行う最終発表や、大学で開催される大宮祭・芝浦祭など、作品を発表できる場はたくさんあります！

- id: 3dcg
  name: 3DCG班
  about:
    content: |
      3DCG班では、Blenderなどのソフトを用いて3Dモデルを制作していたりしています。

      人型のモデルだけでなく小物や部屋など様々なモデルを制作しています。
  activity:
    content: |
      各々のやり方で各々の作りたい人を作る「3DCGで人を創ろう」などの企画をしています。
    works:
      - title: 3DCGで人を創ろう企画
        image: /assets/images/works_3dcg_1.webp
        href: null
  learn_more:
    - title: 使用するツールは何ですか？　初期費用はかかりますか？
      content: |
        主に「Blender」という無料ソフトを使用しており、特におすすめです。

        ゲーム制作の場合は「Unity」を使うこともありますが、3DCG制作がメインであればBlenderの機能だけでほとんど完結します。

        また、YouTubeや検索（Googleなど）を通じて解説動画や情報も非常に多く、初期費用をかけずに創作を始めやすい環境が整っています。

- id: dtm
  name: DTM班
  about:
    content: |
      DTM班では、主にパソコンを用いた音楽制作をしています。

      パソコンと電子機器、楽器などを用いて楽曲やゲームに使用するBGMの提供などをしています。
  activity:
    content: |
      複数人で既存の曲をアレンジしたものをリレー形式でつないでいく「アレンジリレー企画」やみんなで曲を作ってアルバムにして販売する「アルバム企画」、24時間以内の限られた時間で楽曲を制作する「n時間DTM企画」などがあります。
    works:
      - title: アレンジリレー企画
        image: /assets/images/works_dtm_1.webp
        href: null
      - title: n時間DTM企画
        image: /assets/images/works_dtm_2.webp
        href: null
      - title: アルバム企画
        image: /assets/images/works_dtm_3.webp
        href: null
  learn_more:
    - title: DTMを始めたいと思っているのですが、何から始めればいいですか？
      content: |
        まずはDAWを導入しましょう！

        DTMには、DAWという専用のソフトウェアが必要です。DAWには音符の打ち込みやミックス（音量調整）などDTMに不可欠な機能に加えて、基本的な音源（音色のこと）が含まれていることが多いです。そのため、DAWを導入するだけでもDTMに必要な最低限が手に入ります！

        無料なものや試用が可能なものもあるため、まずはいろいろなDAWを試してみることをおすすめします！

