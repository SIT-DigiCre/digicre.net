- id: writing
  name: 文字書き班
  about:
    content: |
      文字書き班では、主に媒体を問わず各々で物語を書いています。
  activity:
    content: |
      ゲームのシナリオを書いていたり、TRPGのシナリオを書いたり、個人で物語を書いたりしています。
    works:
      - title: Advent Calendar企画
        image: /assets/images/works_writing_1.webp
        href: null
  learn_more:
    - title: 実際に部員の書いた文章を読んでみたいです！　どこから読めますか？
      content: |
        こちらから文字書き企画「Advent Calendar 2025」にて行われたアドカレを読むことができます。

        - <https://advent-25.digicre.net/>
    - title: ゲームシナリオに関係する、部員の書いた文章を読んでみたいです！　どこから読めますか？
      content: |
        こちらからノベルゲーム制作企画「ノベゲーを享受せよ」にて制作されたノベルゲームの概要を確認できます。

        - <https://store.steampowered.com/app/4389120/_/>
    - title: 文字書き班員は何人いますか？
      content: |
        自ら名乗っている部員はほとんど居ません。ただ、創作活動を行う上では文字を書く機会に多く遭遇するため、<strong>見方を変えれば部員全員が文字書き班</strong>です。
    - title: 文字書きに関係する企画は予定されていますか？
      content: |
        現時点では予定されていません。

        過去には、「Advent Calendar 2025企画」や、「文字書きやろうよ企画」、「TRPGシナリオを創ろう2025後期企画」などの企画が開催されていました。
    - title: 文字書きに関係する初心者講座の開催は予定されていますか？
      content: |
        現時点では予定されていません。過去にも文字書きに関係する初心者講座は開かれていません。
