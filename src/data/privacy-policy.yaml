title: プライバシーポリシー
content: |
  ## Google Analyticsについて

  本サイトでは、アクセス状況の把握およびサイトの品質向上を目的としてGoogle Analyticsを利用しています。

  Google Analyticsでは、Cookieを用いて本サイトへのアクセス状況に関するデータを収集します。これらのデータは、Google社のプライバシーポリシーに則って取り扱われます。詳しくは「[Google アナリティクス利用規約](https://marketingplatform.google.com/about/analytics/terms/jp/)」をご覧ください。

  なお、Google Analyticsによるデータ収集をオプトアウトする方法に関しては「[Google アナリティクス オプトアウト アドオン](https://tools.google.com/dlpage/gaoptout?hl=ja)」をご参照ください。
